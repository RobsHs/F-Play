<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 54" width="220" height="54" fill="none">
  <defs>
    <!-- Vibrant Crimson Gradient -->
    <linearGradient id="fplay-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1e2d" />
      <stop offset="100%" stop-color="#b80012" />
    </linearGradient>

    <!-- Metallic Border Gradient -->
    <linearGradient id="fplay-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3344" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#4a151b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ff1a2b" stop-opacity="0.8" />
    </linearGradient>

    <!-- Deep Obsidian Surface -->
    <linearGradient id="fplay-surface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181c28" />
      <stop offset="100%" stop-color="#0b0d14" />
    </linearGradient>

    <!-- Subtle Red Glow -->
    <filter id="fplay-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Emblem (48x48) -->
  <g transform="translate(3, 3)">
    <!-- Badge Background -->
    <rect x="0" y="0" width="48" height="48" rx="13" fill="url(#fplay-surface)" stroke="url(#fplay-border)" stroke-width="1.6" />
    
    <!-- Ambient Radial Glow -->
    <circle cx="24" cy="24" r="14" fill="#e50914" fill-opacity="0.2" filter="url(#fplay-glow)" />

    <!-- Stylized "F" (Sharp, Clean, Crisp) -->
    <!-- Vertical Spine -->
    <rect x="13" y="11" width="6" height="26" rx="2" fill="#ffffff" />
    <!-- Top Horizontal Bar -->
    <rect x="13" y="11" width="20" height="6" rx="2" fill="#ffffff" />
    <!-- Middle Horizontal Bar -->
    <rect x="13" y="21" width="12" height="5.5" rx="1.5" fill="#ffffff" />
    
    <!-- Forward Play Chevron nested seamlessly at the middle arm -->
    <polygon points="26,17.5 37,24 26,30.5" fill="url(#fplay-red)" filter="url(#fplay-glow)" />
    <polygon points="28.5,20 34.5,23.8 28.5,27.5" fill="#ffffff" />
  </g>

  <!-- Brand Typography -->
  <!-- "F" in Neon Crimson -->
  <text x="60" y="34" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="url(#fplay-red)" letter-spacing="0.5">F</text>
  
  <!-- Sleek Accent Dot -->
  <circle cx="81" cy="24" r="3.2" fill="#ff2a38" />

  <!-- "PLAY" in Crisp White -->
  <text x="91" y="34" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="0.8">PLAY</text>

  <!-- Clean Subtitle (No muddy box!) -->
  <text x="61" y="47" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#94a3b8" letter-spacing="3.2">CINEMA STREAM</text>
</svg>
