<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="fav-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1e2d" />
      <stop offset="100%" stop-color="#b80012" />
    </linearGradient>
    <linearGradient id="fav-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3344" />
      <stop offset="100%" stop-color="#ff1a2b" />
    </linearGradient>
    <linearGradient id="fav-surface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181c28" />
      <stop offset="100%" stop-color="#0b0d14" />
    </linearGradient>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#fav-surface)" stroke="url(#fav-border)" stroke-width="2.2" />
  
  <circle cx="32" cy="32" r="18" fill="#e50914" fill-opacity="0.22" />

  <!-- Stylized F in pure white -->
  <rect x="18" y="15" width="7" height="34" rx="2.5" fill="#ffffff" />
  <rect x="18" y="15" width="26" height="7.5" rx="2" fill="#ffffff" />
  <rect x="18" y="28" width="16" height="7" rx="2" fill="#ffffff" />
  
  <!-- Play Chevron in crimson red -->
  <polygon points="35,23 49,31.5 35,40" fill="url(#fav-red)" />
  <polygon points="38,26.5 45.5,31.5 38,36.5" fill="#ffffff" />
</svg>
